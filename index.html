<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#121216" />
<title>运营游戏工坊 · AI 运营专家</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23121216'/%3E%3Cpath d='M9 22l7-12 7 12z' fill='none' stroke='%23ff4d6a' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='18' r='2.5' fill='%23ff8095'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="theme.css" />
<style>
  
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
  body{overflow:hidden}
  .bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;background:transparent}
  .bgfx:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.035) 1px,transparent 1px);background-size:32px 32px;mask-image:linear-gradient(180deg,#000,transparent 75%)}
  .app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;max-width:1680px;margin:0 auto}
  header{display:flex;align-items:center;gap:10px;padding:calc(34px + env(safe-area-inset-top)) 16px 10px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
  .orb{width:38px;height:38px;border-radius:8px;flex:none;background:var(--brand);box-shadow:none;position:relative}
  .orb:after{content:"AI";position:absolute;inset:3px;border-radius:10px;background:var(--panel);display:flex;align-items:center;justify-content:center;font-weight:650;font-size:13px;color:var(--text)}
  .brand h1{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand p{font-size:11.5px;color:var(--dim)}
  .hbtn{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);border-radius:8px;height:36px;padding:0 10px;font-size:13px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px}
  .hbtn:hover{border-color:var(--line)}
  .model-pill{font-size:12px;border-color:var(--line)}
  .model-pill i{width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber)}
  .model-pill.live i{background:var(--green);box-shadow:none}
  .main{flex:1;min-height:0;display:flex;gap:16px;padding:0 16px calc(12px + env(safe-area-inset-bottom))}
  .chat{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .msgs{flex:1;overflow-y:auto;padding:16px 14px 8px;scroll-behavior:smooth}
  .msg{display:flex;gap:8px;margin:10px 0;animation:in .35s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes in{from{opacity:0;transform:translateY(8px)}}
  .msg.me{justify-content:flex-end}
  .av{width:30px;height:30px;border-radius:10px;flex:none;background:var(--brand);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:650}
  .bub{max-width:min(86%,640px);padding:10px 13px;border-radius:11px;font-size:14.5px;line-height:1.65;background:rgba(255,255,255,.06);border:1px solid var(--line);border-top-left-radius:6px}
  .me .bub{background:var(--panel);border-color:var(--line);border-top-left-radius:16px;border-top-right-radius:6px}
  .bub b{color:#fff}
  .bub .hl{color:var(--brand-text);font-weight:700}
  .bub ul{padding-left:18px;margin:4px 0}
  .sys{font-size:12px;color:var(--amber);background:rgba(246,200,135,0.08);border:1px dashed rgba(246,200,135,0.4);border-radius:8px;padding:6px 10px;margin:8px auto;max-width:92%;text-align:center}
  .think{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--dim)}
  .think span{opacity:.35;transition:.3s}
  .think span.on{opacity:1;color:var(--text)}
  .think span.on:before{content:"◆ ";color:var(--pink)}
  .dots:after{content:"";animation:dots 1.2s infinite}
  @keyframes dots{0%{content:""}33%{content:"."}66%{content:".."}100%{content:"..."}}
  .ccard{margin-top:10px;border-radius:12px;padding:14px;background:var(--panel);border:1px solid var(--line);box-shadow:none;position:relative;overflow:hidden}
  .ccard:before{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:transparent}
  .ctag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);color:var(--brand-text);margin-right:6px}
  .ctitle{font-size:20px;font-weight:650;margin:8px 0 2px;color:var(--text)}
  .cslogan{font-size:13px;color:var(--brand-text);font-weight:700}
  .cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
  .cbox{background:rgba(27,27,33,0.5);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.6}
  .cbox h5{font-size:12px;color:var(--cyan);margin-bottom:3px}
  .cbox.full{grid-column:1/-1}
  .cact{display:flex;gap:8px;flex-wrap:wrap}
  .btn{appearance:none;border:none;cursor:pointer;font-weight:600;font-size:14px;color:#16060a;padding:11px 16px;border-radius:8px;background:var(--brand);box-shadow:none}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:rgba(255,255,255,.07);color:var(--text);border:1px solid var(--line);box-shadow:none;font-weight:700}
  .btn.play{flex:1;min-width:150px;font-size:15px}
  .src{font-size:11px;color:var(--dim);margin-top:8px}
  .composer{border-top:1px solid var(--line);padding:10px 12px 12px;background:rgba(27,27,33,0.55)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:rgba(255,77,106,0.039);color:var(--text);border-radius:6px;padding:7px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
  .chip:hover{background:rgba(255,77,106,0.088)}
  .inrow{display:flex;gap:8px;align-items:flex-end}
  textarea{flex:1;resize:none;min-height:46px;max-height:130px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);font:inherit;font-size:15px;padding:12px 13px;outline:none}
  textarea:focus{border-color:rgba(255,77,106,0.33);box-shadow:none}
  .send{width:48px;height:46px;border-radius:10px;border:none;cursor:pointer;background:var(--brand);color:#16060a;font-size:20px;font-weight:650}
  .send[disabled]{filter:grayscale(1) brightness(.6)}
  .side{width:400px;flex:none;display:none;flex-direction:column;gap:12px;min-height:0}
  @media (min-width:1000px){.side{display:flex}}
  /* 侧边栏：电脑版常驻，手机版抽屉 */
  .nav{width:268px;flex:none;display:flex;flex-direction:column;gap:10px;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;}
  .nav .newbtn{width:100%}
  .nav h4{font-size:12px;color:var(--dim);letter-spacing:1px;margin:6px 4px 2px;display:flex;justify-content:space-between}
  .nav .scroll{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:2px}
  .sitem{display:flex;flex-direction:column;gap:1px;padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent;font-size:13px}
  .sitem small{color:var(--dim);font-size:11px}
  .sitem:hover{background:rgba(255,255,255,.05)}
  .sitem.on{background:rgba(255,77,106,0.055);border-color:var(--line)}
  .sitem .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .me-card{background:rgba(27,27,33,0.5);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12.5px}
  .me-card b{font-size:18px}
  .navlinks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .navlinks button{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);border-radius:10px;padding:8px 4px;font-size:12.5px;cursor:pointer;position:relative}
  .navlinks button:hover{border-color:var(--line)}
  .navlinks i{position:absolute;top:-6px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:var(--brand);color:#fff;font-size:10.5px;font-style:normal;line-height:17px;padding:0 4px}
  .navlinks i:empty{display:none}
  .navlinks a.planlink{grid-column:1/-1;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--text);border:1px solid var(--line);background:rgba(255,77,106,0.044);border-radius:10px;padding:8px 4px;font-size:12.5px;min-height:36px}
  .navlinks a.planlink:hover{border-color:rgba(255,77,106,0.385)}
  .menu-btn{display:flex}
  @media (min-width:1200px){.menu-btn{display:none}}
  @media (max-width:1199px){.nav{position:fixed;left:0;top:0;bottom:0;z-index:9060;border-radius:0 22px 22px 0;transform:translateX(-105%);transition:transform .28s cubic-bezier(.2,.9,.3,1);padding-top:calc(40px + env(safe-area-inset-top));background:var(--panel);width:min(300px,84vw)}
    .nav.open{transform:none;box-shadow:20px 0 60px rgba(0,0,0,.6)}
    .navmask{position:fixed;inset:0;z-index:9055;background:rgba(5,5,8,0.6);display:none}.navmask.on{display:block}}
  @media (min-width:1200px){.navmask{display:none!important}}
  /* 方向卡 */
  .dirs{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
  .dcard{position:relative;border-radius:12px;padding:13px;background:var(--panel);border:1px solid rgba(118,186,255,0.21);display:flex;flex-direction:column;gap:6px;font-size:12.5px;line-height:1.6;transition:.2s}
  .dcard:hover{border-color:rgba(255,77,106,0.33);box-shadow:none}
  .dcard.rec{border-color:rgba(246,200,135,0.6)}
  .dcard.chosen{border-color:var(--green);box-shadow:0 0 26px rgba(115,215,177,0.25)}
  .dcard.dim{opacity:.45}
  .dcard .dh{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .dcard .dl{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:650;color:#16060a;background:var(--brand);flex:none}
  .dcard .dn{font-size:16px;font-weight:650;color:#fff}
  .dcard .pill{font-size:10.5px;padding:1px 7px;border-radius:6px;border:1px solid var(--line);color:var(--brand-text)}
  .dcard .pill.rec{border-color:var(--amber);color:var(--amber)}
  .dcard .pill.eff{border-color:var(--line);color:var(--brand-text)}
  .dcard .concept{color:#fff;font-weight:700;font-size:13.5px}
  .dcard .k{color:var(--cyan);font-weight:700}
  .dcard .tags{display:flex;flex-wrap:wrap;gap:4px}
  .dcard .tags span{font-size:11px;padding:1px 7px;border-radius:8px;background:rgba(255,255,255,.07);color:var(--text-2)}
  .dcard .btn{margin-top:4px}
  .assume{font-size:12px;color:var(--muted);background:rgba(255,77,106,0.033);border:1px dashed var(--line);border-radius:10px;padding:6px 10px;margin-top:6px}
  details.spec{margin-top:8px;background:rgba(27,27,33,0.5);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.65}
  details.spec summary{cursor:pointer;color:var(--cyan);font-weight:700}
  details.spec h6{font-size:12px;color:var(--brand-text);margin:8px 0 2px}
  .overlay.wide .frame{width:min(1400px,94vw)!important;height:min(860px,90vh)!important}
  .phone{flex:1;min-height:0;border-radius:20px;padding:10px;background:linear-gradient(160deg,var(--panel),var(--panel));border:1px solid var(--line);box-shadow:none;display:flex;flex-direction:column}
  .phone .bar{display:flex;justify-content:space-between;align-items:center;padding:4px 10px 8px;font-size:12px;color:var(--dim)}
  .phone iframe{flex:1;width:100%;border:none;border-radius:16px;background:var(--bg)}
  .phone .empty{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--dim);font-size:13px;line-height:1.8;border-radius:16px;background:rgba(0,0,0,.3);padding:20px}
  .list{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;max-height:200px;overflow:auto}
  .list h4{font-size:13px;color:var(--cyan);margin-bottom:6px}
  .litem{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px;cursor:pointer}
  .litem:hover{color:var(--brand-text)}
  .litem small{color:var(--dim)}
  .overlay{position:fixed;inset:0;z-index:9050;background:var(--bg);display:none;flex-direction:column}
  .overlay.on{display:flex}
  .overlay .ob{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:calc(30px + env(safe-area-inset-top)) 12px 8px;background:var(--bg)}
  .overlay iframe{flex:1;border:none;width:100%}
  @media (min-width:1000px){.overlay{background:rgba(5,5,8,0.8);align-items:center;justify-content:center}.overlay .frame{width:420px;height:min(860px,92vh);display:flex;flex-direction:column;border-radius:18px;overflow:hidden;border:1px solid var(--line)}.overlay .ob{padding:10px 12px}}
  .overlay .frame{flex:1;display:flex;flex-direction:column;min-height:0}
  .form label{display:block;font-size:12.5px;color:var(--dim);margin:12px 0 5px}
  .form input,.form select{width:100%;height:42px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);font:inherit;font-size:14px;padding:0 12px;outline:none}
  .form select option{background:var(--panel)}
  .form input:focus,.form select:focus{border-color:rgba(255,77,106,0.33)}
  .form .hint{font-size:11.5px;color:var(--dim);margin-top:4px;line-height:1.5}
  .kv{display:flex;gap:8px}
  .kv input{flex:1}
  .switch{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:12px}
  .switch input{width:18px;height:18px}
  .tstat{font-size:12.5px;margin-top:10px;min-height:18px;line-height:1.5;word-break:break-all}
  .brand>div{min-width:0}
  .msgs{container-type:inline-size;position:relative}
  @container (min-width:880px){.dirs.wide3{grid-template-columns:repeat(3,1fr)}}
  @media (max-width:560px){#rulesBtn,#walletBtn{display:none}.dcard .dn{font-size:15px}.hbtn .t{display:none}.brand p{display:none}header{gap:6px;padding-left:12px;padding-right:12px}.main{padding:0 8px calc(8px + env(safe-area-inset-bottom))}.chat{border-radius:12px}.cgrid{grid-template-columns:1fr}}
  /* ===== 移动端优先 ===== */
  html,body{overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  .app{height:var(--vvh,100%)}
  .msgs{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  button,summary,.chip,.sitem,.litem{touch-action:manipulation}
  header{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
  .main{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
  .composer{padding-bottom:12px}
  .ddots{display:none}
  @media (pointer:coarse){
    .hbtn{height:44px;min-width:44px;justify-content:center}
    .chip{min-height:44px;display:flex;align-items:center}
    .btn{min-height:44px}
    .send{width:52px;height:50px}
    .navlinks button,.navlinks a.planlink{min-height:44px}
    .sitem,.litem{min-height:44px;justify-content:center}
    details.spec summary{min-height:44px;display:flex;align-items:center}
    textarea{font-size:16px}
  }
  @media (max-width:760px){
    .main{padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}
    /* 方向卡：横向滑动轮播 */
    .dirs.wide3{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;margin:10px -13px 0;padding:2px 13px 4px;scrollbar-width:none;overscroll-behavior-x:contain;scroll-padding:0 13px}
    .dirs.wide3::-webkit-scrollbar{display:none}
    .dirs.wide3 .dcard{flex:none;width:86%;scroll-snap-align:center;scroll-snap-stop:always}
    .ddots{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:6px;font-size:11.5px;color:var(--dim)}
    .ddots button{width:44px;height:28px;border:none;background:none;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
    .ddots button i{display:block;width:8px;height:8px;border-radius:5px;background:rgba(255,255,255,.25);transition:.2s}
    .ddots button.on i{width:22px;background:var(--brand)}
    body.kb header{padding-top:calc(6px + env(safe-area-inset-top))}
    body.kb .brand p,body.kb .ou-banner{display:none}
    body.kb .main{padding-bottom:6px}
  }
  /* 极矮可视区（横屏 + 键盘）：只留对话与输入框 */
  @media (max-height:330px){header{display:none}.chips{display:none}.main{padding-top:4px;padding-bottom:4px}.composer{padding:6px 10px}.msgs{padding-top:8px}}
</style>

<script src="shell.js"></script>

<body>
<div class="bgfx"></div>
<aside class="k-rail" id="kRail" aria-label="主导航"></aside>
<div class="app">
  <header class="k-topbar">
    <div class="tb-left"><button class="k-icon-btn menu-btn" id="navBtn" aria-label="历史对话与我的活动"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button><div class="k-wordmark">运营游戏工坊<span>/ AI 运营专家</span></div></div>
    <div class="k-top-actions" id="topActions"><button class="hbtn model-pill" id="modelPill" title="模型设置"><i></i><span id="modelLabel">演示引擎</span></button><a class="k-link" href="plan.html">平台规划 ↗</a></div>
  </header>
  <div class="main">
    <nav class="nav" id="nav">
      <button class="btn newbtn" id="newChat">＋ 新的策划</button>
      <h4>历史对话</h4>
      <div class="scroll" id="sessList"></div>
      <h4>我的活动 <span id="campCount"></span></h4>
      <div class="scroll" id="campList" style="max-height:28%"></div>
      <div class="me-card" id="meCard"></div>
      <div class="navlinks"><button id="nMissions">✅ 任务中心<i id="nBadge"></i></button><button id="nRules">📜 活动规则</button><button id="nWallet">🎁 我的权益</button><button id="nSettings">⚙ 模型设置</button><a class="planlink" href="plan.html">🗺 平台规划</a></div>
    </nav>
    <div class="navmask" id="navMask"></div>
    <section class="chat">
      <div class="msgs" id="msgs"></div>
      <div class="composer">
        <div class="chips" id="chips"></div>
        <div class="inrow"><textarea id="inp" rows="1" placeholder="说出你的需求，一句话就行：比如 Intel 新品芯片上市，想拉新+话题传播"></textarea><button class="send" id="sendBtn" aria-label="发送">➤</button></div>
      </div>
    </section>
    <aside class="side"><div class="side-head"><span class="k-eyebrow">LIVE PREVIEW</span><span class="k-small k-muted">手机端实时预览</span></div>
      <div class="phone"><div class="bar"><span id="pvTitle">手机端预览</span><span id="pvOpen"></span></div><div class="empty" id="pvEmpty">🎮<br>选定方向后，这里实时预览<br>手机端效果</div><iframe id="pvFrame" title="活动预览" style="display:none" allow="clipboard-write"></iframe></div>
    </aside>
  </div>
</div>
<div class="overlay" id="overlay"><div class="frame"><div class="ob"><button class="btn ghost" id="ovClose">‹ 返回对话</button><span id="ovTitle" style="font-size:13px;color:var(--dim);flex:1;text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis"></span><a class="btn ghost" id="ovNew" target="_blank" rel="noopener" style="text-decoration:none">新窗口</a></div><iframe id="ovFrame" title="活动试玩" allow="clipboard-write"></iframe></div></div>

<script src="ops-config.js"></script>
<script src="ops-engine.js"></script>
<script src="ops-ui.js"></script>

<script>
(() => {
'use strict';
const C = window.OPS_CONFIG, esc = OpsUI.esc, $ = (id) => document.getElementById(id);
const CAMP_KEY = 'ops_campaigns_v1', SESS_KEY = 'ops_sessions_v1';

/* ===================== AI 运营专家：系统提示词 =====================

  if (/门店|到店|线下|核销|券|引流|客流|打卡|签到/.test(t)) sc['store-coupon'] += 2;

const BANNED = /nvidia|英伟达|amd|超威|huawei|华为|麒麟芯|apple|苹果|高通|qualcomm|联发科|mediatek/i;

const arr = (v, n, len) => (Array.isArray(v) ? v : []).slice(0, n).map(x => S_(typeof x === 'string' ? x : JSON.stringify(x), len)).filter(Boolean).filter(x => !BANNED.test(x));
function sanitizeDirections(j) {
  const ds = (j && Array.isArray(j.directions) ? j.directions : []).slice(0, 3).map((d, i) => {
    const f = C.formats[d.format] ? d.format : FMT_ORDER[i]; const tpl = DIR_TPL[f];
    const pick = (k, n) => { const v = S_(d[k], n); return v && !BANNED.test(v) ? v : tpl[k]; };
    return { id: 'ABC'[i], format: f, name: pick('name', 14), concept: pick('concept', 60), why: S_(d.why, 80) || '', loop: pick('loop', 90), ops: arr(d.ops, 5, 50).length ? arr(d.ops, 5, 50) : tpl.ops, sections: arr(d.sections, 8, 20).length ? arr(d.sections, 8, 20) : tpl.sections, kpi: pick('kpi', 50), effort: ['低', '中', '高'].includes(d.effort) ? d.effort : tpl.effort, recommended: !!d.recommended };
  });

  track.addEventListener('scroll', () => requestAnimationFrame(syncDots), { passive: true });
  dots.forEach((d, i) => d.onclick = () => cardsEl[i].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }));
  const startIdx = Math.max(0, it.chosen ? it.directions.findIndex(d => d.id === it.chosen) : 0);

/* ===================== 对话流程 ===================== */
let busy = false;
async function callModel(userText, steps) {
  cur.history.push({ role: 'user', content: userText });
  const th = thinking(steps);
  try {
    const content = await AIClient.chat([{ role: 'system', content: SYSTEM_PROMPT }, ...cur.history.slice(-8)], { maxTokens: 2400, timeout: 45000 });
    const j = AIClient.extractJSON(content); cur.history.push({ role: 'assistant', content: JSON.stringify(j) });
    th.done(); return j;
  } catch (e) { th.done(); cur.history.pop(); throw e; }
}
async function send(text) {
  text = (text || inp.value).trim(); if (!text || busy) return;
  busy = true; sendBtn.disabled = true; inp.value = ''; autoGrow();
  if (cur.items.length === 0) cur.title = text.slice(0, 22);
  bubble('me', esc(text)); pushItem({ k: 'me', text });
  const steps = ['解析需求，补齐默认值', '发散 3 个差异化方向', '为每个方向配运营机制'];
  let res = null, source = 'demo';
  if (AIClient.configured()) {
    try { res = sanitizeDirections(await callModel(text, steps)); source = 'llm'; }
    catch (e) { const m = '模型调用失败：' + e.message + ' → 已回退到演示规则引擎'; sysLine(m); pushItem({ k: 'sys', text: m }); console.warn('[AI]', e.message); }
  }
  if (!res) { const th = thinking(steps); await new Promise(r => setTimeout(r, 1300)); th.done(); res = sanitizeDirections(demoDirections(text)); cur.history.push({ role: 'user', content: text }, { role: 'assistant', content: JSON.stringify(Object.assign({ type: 'directions' }, res)) }); }
  const it = { k: 'dirs', assumptions: res.assumptions, directions: res.directions, chosen: null, source, goal: text };
  renderDirections(it); pushItem(it);
  busy = false; sendBtn.disabled = false;
}
async function pickDirection(it, id, el) {
  if (busy || it.chosen) return; busy = true; sendBtn.disabled = true;
  const dir = it.directions.find(d => d.id === id); it.chosen = id; saveSessions();
  el.remove(); renderDirections(it);
  const msg = `选择方向 ${id}：${dir.name}`;
  bubble('me', esc(msg)); pushItem({ k: 'me', text: msg });
  const steps = ['展开玩法与菜单结构', '生成任务 / 产品介绍 / 规则', '配置奖励与运营节奏', '生成试玩链接'];
  let camp = null, source = 'demo';
  if (AIClient.configured()) {
    try { const j = await callModel(msg + '\n' + JSON.stringify(dir), steps); camp = sanitizeCampaign(j.campaign || j, dir); source = 'llm'; }
    catch (e) { const m = '模型调用失败：' + e.message + ' → 已回退到演示规则引擎'; sysLine(m); pushItem({ k: 'sys', text: m }); }
  }
  if (!camp) { const th = thinking(steps); await new Promise(r => setTimeout(r, 1300)); th.done(); camp = sanitizeCampaign(demoCampaign(dir).campaign, dir); }
  Object.assign(camp, { id: 'c' + Date.now().toString(36), t: Date.now(), source, model: AIClient.label(), goal: it.goal, direction: dir.name });
  renderCampaign(camp); pushItem({ k: 'camp', camp }); saveCamp(camp);
  openPreview(camp, !matchMedia('(min-width:1000px)').matches);
  busy = false; sendBtn.disabled = false;
}

const CHIPS = ['新品上市拉新', '门店引流', '品牌曝光裂变', 'Intel 新品芯片上线，要有 3D 打 Boss', '双 11 促活老用户', '线下体验店周末客流'];
$('chips').innerHTML = CHIPS.map(c => `<button class="chip">${esc(c)}</button>`).join('');
$('chips').querySelectorAll('.chip').forEach(b => b.onclick = () => send(b.textContent));
function autoGrow() { inp.style.height = 'auto'; inp.style.height = Math.min(130, inp.scrollHeight) + 'px'; }
inp.addEventListener('input', autoGrow);
inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
sendBtn.onclick = () => send();
function __mountShell() {
KShell.mountRail($('kRail'), { home: 'index.html', items: [
  { id: 'railChat', icon: 'chat', label: 'AI 策划', active: true },
  { id: 'railMissions', icon: 'missions', label: '任务中心', badge: 'rBadge' },
  { id: 'walletBtn', icon: 'wallet', label: '我的权益 · 抽奖 · 排行' },
  { id: 'rulesBtn', icon: 'rules', label: '活动规则' },
  { href: 'plan.html', icon: 'plan', label: '平台规划' }], bottom: [{ id: 'gearBtn', icon: 'gear', label: '模型设置' }] });
}
__mountShell();
$('gearBtn').onclick = $('modelPill').onclick = openSettings;
$('rulesBtn').onclick = () => OpsUI.openRules();
$('walletBtn').onclick = () => OpsUI.openWallet({ onChange: renderNav, share: { title: C.campaignName, subtitle: '新芯出阵，制程为刃', cta: '扫码来玩芯片争霸！' } });
/* 平台规划页的深链：#missions / #wallet / #rules 直接打开对应面板 */
function openFromHash() { const h = location.hash; if (document.querySelector('.ou-root.on')) return; if (h === '#missions') OpsUI.openMissions({ onClose: renderNav }); else if (h === '#wallet') $('walletBtn').click(); else if (h === '#rules') OpsUI.openRules(); }
setTimeout(openFromHash, 300); window.addEventListener('hashchange', openFromHash);
OpsUI.banner();
{ const bn = document.querySelector('.ou-banner'); if (bn) { bn.title = bn.textContent; $('topActions').prepend(bn); } }
$('railChat').onclick = () => { closeNav(); msgs.scrollTo({ top: 0, behavior: 'smooth' }); };
$('railMissions').onclick = () => $('nMissions').click();
/* 当前打开的面板 ↔ 左栏高亮；面板关闭回到「AI 策划」 */
{ const map = { '任务中心': 'railMissions', '我的权益': 'walletBtn', '积分抽奖': 'walletBtn', '分享得加场': 'walletBtn', '活动规则': 'rulesBtn', '模型设置': 'gearBtn' };
  new MutationObserver(() => { const sh = document.querySelectorAll('.ou-mask .ou-sheet'); const last = sh[sh.length - 1]; KShell.setActive($('kRail'), last ? (map[last.getAttribute('aria-label')] || 'railChat') : 'railChat'); }).observe(document.body, { childList: true }); }
refreshPill();
if (sessions.length && sessions[0].items.length === 0) cur = sessions[0]; else newSession();
renderSession(); renderNav();
window.__platform = { send, pickDirection, demoDirections, demoCampaign, sanitizeDirections, sanitizeCampaign, campaignURL, SYSTEM_PROMPT, get cur() { return cur; } };
})();
</script>
</body>
</html>
