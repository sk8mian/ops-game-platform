<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#030714" />
<title>芯片争霸 3D · Intel 新品闯关</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230068B5'/%3E%3Crect x='8' y='8' width='16' height='16' rx='2' fill='%2300C7FD'/%3E%3C/svg%3E" />
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#030714;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;color:#e8f0ff}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block}
  .hud{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;transition:opacity .3s}
  .hud.on{opacity:1}
  .hud-top{position:absolute;left:0;right:0;top:max(30px,calc(env(safe-area-inset-top) + 26px));padding:0 14px;display:flex;justify-content:space-between;align-items:flex-start}
  .pill{background:rgba(6,14,36,.62);border:1px solid rgba(0,224,255,.35);border-radius:14px;padding:6px 10px;backdrop-filter:blur(6px);font-size:12px;line-height:1.35;box-shadow:0 0 18px rgba(0,224,255,.15)}
  .pill b{font-size:18px;color:#fff;text-shadow:0 0 10px #00e0ff}
  .pill .lv{color:#7af3ff;font-weight:700}
  .right{display:flex;gap:8px;align-items:center;pointer-events:auto}
  .hearts{font-size:16px;letter-spacing:2px;text-shadow:0 0 8px #ff4f7b}
  .ibtn{pointer-events:auto;border:1px solid rgba(0,224,255,.4);background:rgba(6,14,36,.62);color:#fff;border-radius:12px;height:34px;min-width:34px;padding:0 8px;font-size:15px;cursor:pointer}
  .boss{position:absolute;left:50%;transform:translateX(-50%);top:max(84px,calc(env(safe-area-inset-top) + 80px));width:min(78vw,520px);text-align:center;display:none}
  .boss.on{display:block}
  .boss .nm{font-size:13px;font-weight:800;letter-spacing:2px;margin-bottom:4px;text-shadow:0 0 10px currentColor}
  .boss .bar{height:9px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;border:1px solid rgba(255,255,255,.2)}
  .boss .bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff4f7b,#ffd166);transition:width .15s}
  .chips{position:absolute;left:14px;bottom:calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
  .chip{font-size:11.5px;padding:4px 9px;border-radius:10px;background:rgba(6,14,36,.62);border:1px solid rgba(122,243,255,.35);color:#bff6ff}
  .chip.sh{border-color:#3dff9a;color:#b9ffd9}
  .npu{position:absolute;right:16px;bottom:calc(22px + env(safe-area-inset-bottom));width:84px;height:84px;border-radius:50%;pointer-events:auto;cursor:pointer;border:none;color:#fff;font-weight:900;font-size:13px;line-height:1.15;background:conic-gradient(#ffd166 var(--p,0%),rgba(255,255,255,.08) 0);box-shadow:0 0 0 3px rgba(6,14,36,.9) inset,0 0 18px rgba(255,209,102,.25)}
  .npu span{position:absolute;inset:7px;border-radius:50%;background:radial-gradient(circle,#22183f,#0a0a1e);display:flex;align-items:center;justify-content:center;flex-direction:column}
  .npu.ready{animation:pulse 1s infinite;box-shadow:0 0 0 3px rgba(6,14,36,.9) inset,0 0 34px #ffd166}
  @keyframes pulse{50%{transform:scale(1.07)}}
  .center-msg{position:fixed;left:0;right:0;top:36%;text-align:center;z-index:6;pointer-events:none;opacity:0;transition:opacity .3s, transform .3s;transform:scale(.9)}
  .center-msg.on{opacity:1;transform:none}
  .center-msg h2{font-size:30px;font-weight:900;letter-spacing:3px;text-shadow:0 0 20px currentColor}
  .center-msg p{font-size:14px;color:#cfe0ff;margin-top:8px}
  .warn h2{color:#ff4f7b;animation:blink .35s infinite alternate}
  @keyframes blink{to{opacity:.35}}
  .pts-pop{position:fixed;z-index:6;pointer-events:none;font-weight:900;font-size:14px;color:#ffd166;text-shadow:0 0 8px #ffb300;animation:pop 0.9s forwards}
  @keyframes pop{to{transform:translateY(-36px);opacity:0}}
  .screen{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:58px 18px calc(20px + env(safe-area-inset-bottom));background:radial-gradient(ellipse at 50% 30%,rgba(10,30,80,.55),rgba(2,4,14,.88));backdrop-filter:blur(3px);overflow:auto}
  .screen.on{display:flex}
  .card{width:100%;max-width:440px;text-align:center}
  .logo{font-size:12px;letter-spacing:4px;color:#7af3ff;margin-bottom:6px}
  .title{font-size:clamp(34px,10vw,52px);font-weight:900;line-height:1.05;background:linear-gradient(180deg,#fff,#7af3ff 60%,#3a7bff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(0,224,255,.5))}
  .sub{margin-top:8px;color:#ff8be8;font-weight:700;letter-spacing:2px}
  .how{margin:14px auto 0;font-size:13px;line-height:1.7;color:#b9c8ec;max-width:360px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
  .stat{background:rgba(10,20,52,.7);border:1px solid rgba(120,170,255,.22);border-radius:14px;padding:8px 4px}
  .stat b{display:block;font-size:20px;color:#fff}
  .stat span{font-size:11px;color:#8c9cc4}
  .bigbtn{display:block;width:100%;border:none;cursor:pointer;font-size:18px;font-weight:900;letter-spacing:2px;color:#041022;padding:15px;border-radius:16px;background:linear-gradient(90deg,#00e0ff,#7c8cff 55%,#ff4fd8);box-shadow:0 8px 30px rgba(0,224,255,.35);margin-top:6px}
  .bigbtn:active{transform:scale(.98)}
  .bigbtn[disabled]{filter:grayscale(1) brightness(.6)}
  .row{display:flex;gap:8px;margin-top:10px}
  .row button{flex:1}
  .sbtn{border:1px solid rgba(120,170,255,.3);background:rgba(255,255,255,.06);color:#e8f0ff;border-radius:13px;padding:11px 6px;font-size:14px;font-weight:700;cursor:pointer}
  .sbtn.hot{border-color:#ffd166;color:#ffd166;box-shadow:0 0 16px rgba(255,209,102,.25)}
  .tier{margin:12px 0 4px;font-size:13px}
  .tbar{height:8px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden}
  .tbar i{display:block;height:100%;background:linear-gradient(90deg,#00e0ff,#ff4fd8)}
  .small{font-size:11.5px;color:#8c9cc4;margin-top:6px}
  .res-title{font-size:40px;font-weight:900;text-shadow:0 0 24px currentColor}
  .breakdown{margin:12px 0;background:rgba(10,20,52,.7);border:1px solid rgba(120,170,255,.22);border-radius:14px;padding:10px 14px;text-align:left;font-size:13px;line-height:1.8}
  .breakdown div{display:flex;justify-content:space-between}
  .breakdown .tot{border-top:1px dashed rgba(120,170,255,.3);margin-top:4px;padding-top:4px;font-weight:800;color:#ffd166;font-size:15px}
  .back{position:fixed;left:12px;top:max(30px,calc(env(safe-area-inset-top) + 26px));z-index:21;font-size:12px;color:#8fb6ff;text-decoration:none;background:rgba(6,14,36,.6);padding:5px 10px;border-radius:10px;border:1px solid rgba(120,170,255,.25)}
  .nogl{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:50;background:#030714}
  /* ===== 主菜单 / 面板 / 暂停 ===== */
  .menu-card{max-width:460px}
  .menu-card .how{font-size:12.5px}
  .mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .mbtn{position:relative;border:1px solid rgba(120,170,255,.25);background:rgba(10,20,52,.72);color:#e8f0ff;border-radius:14px;padding:10px 4px 8px;cursor:pointer;font-size:20px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.15s}
  .mbtn b{font-size:12.5px;font-weight:700}
  .mbtn:hover{border-color:#00e0ff;background:rgba(0,224,255,.12);transform:translateY(-1px)}
  .badge{position:absolute;top:-6px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:#ff4f7b;color:#fff;font-size:11px;font-style:normal;line-height:18px;padding:0 5px;box-shadow:0 0 10px #ff4f7b}
  .badge:empty{display:none}
  .panel-card{max-width:520px;text-align:left;background:rgba(8,14,36,.94);border:1px solid rgba(120,170,255,.25);border-radius:22px;padding:16px;max-height:calc(100vh - 90px);overflow:auto;box-shadow:0 0 40px rgba(0,224,255,.12)}
  .phead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .phead h3{flex:1;font-size:18px;background:linear-gradient(90deg,#7af3ff,#ff8be8);-webkit-background-clip:text;background-clip:text;color:transparent}
  .pback{border:1px solid rgba(120,170,255,.3);background:rgba(255,255,255,.06);color:#e8f0ff;border-radius:11px;padding:7px 12px;font-size:13px;cursor:pointer}
  .set-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px dashed rgba(120,170,255,.15);font-size:14px}
  .set-row small{display:block;color:#8c9cc4;font-size:11.5px}
  .seg{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
  .seg button{border:1px solid rgba(120,170,255,.3);background:rgba(255,255,255,.05);color:#cfe0ff;border-radius:9px;padding:6px 10px;font-size:12.5px;cursor:pointer}
  .seg button.on{background:linear-gradient(90deg,#00e0ff,#ff4fd8);color:#041022;border-color:transparent;font-weight:800}
  .set-row input[type=range]{width:130px}
  .lbl{list-style:none;padding:0;margin:0}
  .lbl li{display:flex;justify-content:space-between;padding:9px 6px;border-bottom:1px dashed rgba(120,170,255,.12);font-size:14px}
  .lbl li.me{color:#7af3ff;font-weight:800;background:rgba(0,224,255,.06);border-radius:8px}
  .lbl li .rk{display:inline-block;width:26px;color:#8c9cc4}
  .lbl li:nth-child(1) .rk{color:#ffd166}.lbl li:nth-child(2) .rk{color:#c9d6ea}.lbl li:nth-child(3) .rk{color:#d08a4f}
  .pause-card .bigbtn{margin-top:10px}
  .pause-card .sbtn{width:100%;margin-top:8px}
  /* ===== 道具 → 卖点知识卡 ===== */
  .kcard{position:fixed;left:50%;bottom:calc(122px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:8;pointer-events:none;transition:.3s;display:flex;gap:10px;align-items:center;background:rgba(10,16,40,.92);border:1px solid #ffd166;border-radius:16px;padding:9px 10px 9px 12px;box-shadow:0 0 24px rgba(255,209,102,.35);max-width:92vw;font-size:13px;white-space:nowrap}
  .kcard.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .kcard button{border:none;border-radius:10px;padding:6px 10px;font-weight:800;font-size:12.5px;cursor:pointer;color:#041022;background:#ffd166}
  /* ===== 产品介绍 ===== */
  .prod{position:fixed;inset:0;z-index:15;display:none;pointer-events:none}
  .prod.on{display:block}
  .ptop{position:absolute;top:max(34px,calc(env(safe-area-inset-top) + 30px));left:12px;right:12px;display:flex;gap:10px;align-items:flex-start;pointer-events:auto}
  .ptitle{flex:1;min-width:0}
  .ptitle h2{font-size:21px;font-weight:900;background:linear-gradient(90deg,#fff,#7af3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .ptitle p{font-size:12.5px;color:#cfe0ff;margin-top:2px}
  .pdisc{display:inline-block;margin-top:5px;font-size:11px;color:#ffd27a;border:1px dashed rgba(255,190,60,.6);border-radius:8px;padding:2px 7px;background:rgba(255,190,60,.1)}
  .ptools{position:absolute;right:12px;top:max(150px,calc(env(safe-area-inset-top) + 140px));display:flex;flex-direction:column;gap:8px;pointer-events:auto}
  .ptools button{border:1px solid rgba(0,224,255,.4);background:rgba(6,14,36,.72);color:#e8f0ff;border-radius:12px;padding:8px 10px;font-size:12px;cursor:pointer}
  .pprog{font-size:11.5px;color:#8c9cc4;text-align:center}
  .pcards{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;overflow-x:auto;padding:4px 12px;pointer-events:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
  .pcards::-webkit-scrollbar{display:none}
  .fcard{flex:none;width:74vw;max-width:300px;scroll-snap-align:center;background:rgba(8,14,36,.84);border:1px solid rgba(120,170,255,.25);border-radius:18px;padding:12px;cursor:pointer;backdrop-filter:blur(8px);transition:.2s;text-align:left;color:#e8f0ff}
  .fcard.on{border-color:var(--fc);box-shadow:0 0 22px var(--fcg)}
  .fcard h4{font-size:15px;display:flex;align-items:center;gap:6px}
  .fcard h4 em{font-style:normal;font-size:11px;color:#3dff9a;margin-left:auto}
  .fcard .s{font-size:12px;color:var(--fc);font-weight:700;margin-top:2px}
  .fcard p{font-size:12.5px;line-height:1.6;color:#cdd8f4;margin-top:6px}
  .fcard .spec{margin-top:6px;font-size:12px;font-family:ui-monospace,Menlo,monospace;color:#9ff;background:rgba(0,0,0,.3);border-radius:8px;padding:4px 7px;display:inline-block}
  .fcard .d{font-size:10.5px;color:#ffcf6e;margin-top:6px}
  /* ===== 电脑版：侧边 HUD ===== */
  .side{display:none}
  body.desk .side{display:flex;flex-direction:column;gap:10px;position:absolute;top:84px;width:250px;pointer-events:none}
  body.desk #sideL{left:20px} body.desk #sideR{right:20px}
  .scard{background:rgba(6,14,36,.66);border:1px solid rgba(0,224,255,.25);border-radius:16px;padding:12px 14px;backdrop-filter:blur(8px);font-size:13px;line-height:1.6;box-shadow:0 0 18px rgba(0,224,255,.1)}
  .scard h5{font-size:12.5px;color:#7af3ff;margin-bottom:6px;letter-spacing:1px}
  .scard .bigpts{font-size:30px;font-weight:900;color:#fff;text-shadow:0 0 12px #00e0ff}
  .scard .mrow{display:flex;justify-content:space-between;font-size:12px;color:#cfe0ff}
  .scard .mbar{height:5px;border-radius:5px;background:rgba(255,255,255,.08);margin:3px 0 7px;overflow:hidden}
  .scard .mbar i{display:block;height:100%;background:linear-gradient(90deg,#00e0ff,#ff4fd8)}
  .scard kbd{display:inline-block;min-width:22px;text-align:center;border:1px solid rgba(160,200,255,.4);border-bottom-width:2px;border-radius:6px;padding:0 5px;margin-right:4px;font-size:11.5px;font-family:inherit;color:#fff;background:rgba(255,255,255,.06)}
  body.desk .hud-top .pill,body.desk .chips{display:none}
  body.desk .hud-top{justify-content:flex-end}
  body.desk .npu{width:108px;height:108px;right:42px;bottom:42px}
  body.desk .screen.menu{justify-content:flex-start;padding-left:7vw;background:linear-gradient(90deg,rgba(2,4,14,.94),rgba(2,4,14,.62) 42%,rgba(2,4,14,0) 72%)}
  body.desk .screen.menu .card{text-align:left}
  body.desk .screen.menu .how{margin-left:0}
  body.desk .kcard{bottom:50px}
  body.desk .pcards{left:auto;right:24px;top:96px;bottom:24px;width:360px;flex-direction:column;overflow-y:auto;overflow-x:hidden;padding:4px}
  body.desk .fcard{width:auto;max-width:none}
  body.desk .ptop{right:410px;left:28px}
  body.desk .ptools{right:410px;top:auto;bottom:28px;flex-direction:row}
  body.desk .ptitle h2{font-size:30px}

  /* ===== 移动端优先：防滚动/缩放/长按、触控目标 ≥44px、安全区 ===== */
  html,body{overscroll-behavior:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  button,a{touch-action:manipulation;font-family:inherit}
  .screen{touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  /* 内容超高时不被居中裁掉顶部；顶部让出 演示条 + 返回按钮 + 刘海 */
  .screen{align-items:flex-start;padding-top:calc(max(30px, env(safe-area-inset-top) + 26px) + 54px)}
  .screen>.card{margin:auto}
  body.desk .screen.menu>.card{margin:auto 0}
  .panel-card{overscroll-behavior:contain}
  .pcards{touch-action:pan-x;overscroll-behavior:contain}
  .ibtn{height:44px;min-width:44px;border-radius:14px;font-size:17px}
  .pback{min-height:44px;min-width:44px;padding:0 14px}
  .seg button{min-height:44px;min-width:44px;padding:0 12px}
  .ptools button{min-height:44px;padding:0 12px}
  .kcard button{min-height:44px;padding:0 14px}
  .back{min-height:44px;min-width:44px;display:flex;align-items:center;padding:0 12px;font-size:13px}
  .sbtn{min-height:48px}
  .mbtn{min-height:64px}
  .bigbtn{min-height:54px}
  .set-row input[type=range]{height:44px}
  .hud-top{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
  .chips{left:max(14px,env(safe-area-inset-left))}
  .npu{right:max(16px,calc(env(safe-area-inset-right) + 8px))}
  .back{left:max(12px,env(safe-area-inset-left))}
  .screen{padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}
  .ptop{left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right))}
  .ptools{right:max(12px,env(safe-area-inset-right))}
  /* ===== 虚拟摇杆（左手，浮动）+ NPU 大按钮（右手） ===== */
  .joy{position:fixed;z-index:6;left:calc(env(safe-area-inset-left) + 96px);bottom:calc(env(safe-area-inset-bottom) + 30px);width:132px;height:132px;margin:0 0 0 -66px;border-radius:50%;pointer-events:none;border:2px solid rgba(0,224,255,.5);background:radial-gradient(circle,rgba(0,224,255,.12),rgba(6,14,36,.4) 70%);box-shadow:0 0 24px rgba(0,224,255,.25);opacity:0;transition:opacity .15s;display:none}
  body.touch.stick .joy{display:block}
  .joy.ghost{opacity:.42}
  .joy.ghost::after{content:'左手拖动';position:absolute;left:0;right:0;top:100%;margin-top:4px;text-align:center;font-size:11px;color:#9fdcff;letter-spacing:1px}
  .joy.on{opacity:1;margin:-66px 0 0 -66px;bottom:auto}
  .joy i{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#aaf8ff,#00a6d6 60%,#05507a);box-shadow:0 0 18px #00e0ff;will-change:transform}
  body.touch .npu{width:100px;height:100px;font-size:15px;bottom:calc(30px + env(safe-area-inset-bottom))}
  body.touch .npu:active{transform:scale(.94)}
  body.touch.stick .chips{left:50%;transform:translateX(-50%);align-items:center;bottom:calc(30px + env(safe-area-inset-bottom))}
  body.touch .kcard{bottom:calc(150px + env(safe-area-inset-bottom))}
  /* ===== 竖屏为主；横屏自适配 HUD ===== */
  .mc-info,.mc-act{width:100%}
  @media (orientation:landscape) and (max-height:520px){
    .hud-top{top:max(8px,env(safe-area-inset-top))}
    .pill{font-size:11px;padding:4px 9px}.pill b{font-size:16px}
    .boss{top:max(40px,calc(env(safe-area-inset-top) + 36px));width:min(46vw,420px)}
    .center-msg{top:26%}.center-msg h2{font-size:24px}
    body.touch .npu{width:86px;height:86px;bottom:calc(16px + env(safe-area-inset-bottom))}
    .joy{bottom:calc(env(safe-area-inset-bottom) + 16px);left:calc(env(safe-area-inset-left) + 110px)}
    body.touch.stick .chips{bottom:calc(14px + env(safe-area-inset-bottom));flex-direction:row}
    body.touch .kcard{bottom:calc(20px + env(safe-area-inset-bottom))}
    .screen{padding-top:34px;padding-bottom:calc(10px + env(safe-area-inset-bottom));align-items:flex-start}
    .menu-card{max-width:820px;display:flex;gap:22px;align-items:center;text-align:left;margin:auto 0}
    .menu-card .title{font-size:38px}.menu-card .how{margin-left:0;font-size:12px}
    .menu-card .stats{margin:10px 0 4px}.menu-card .mgrid{margin-top:8px}.menu-card .mbtn{min-height:52px;flex-direction:row;justify-content:center;font-size:17px;gap:6px}
    .pause-card{max-width:640px;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:auto 0}
    .pause-card .res-title,.pause-card .how,.pause-card .bigbtn{grid-column:1/-1}.pause-card .sbtn{margin-top:0}.pause-card .res-title{font-size:26px!important}
    .panel-card{max-height:calc(100vh - 44px)}

const showRoot = new T.Group(); showScene.add(showRoot);
const tiles = {};
(function buildShowcase() {

  for (let sd = 0; sd < 4; sd++) for (let i = 0; i < 30; i++) { const o = -2.75 + i * 0.19; const pos = [[o, 3.1], [o, -3.1], [3.1, o], [-3.1, o]][sd]; _m.position.set(pos[0], -0.1, pos[1]); _m.rotation.set(0, sd >= 2 ? Math.PI / 2 : 0, 0); _m.scale.set(1, 1, 1); _m.updateMatrix(); pins.setMatrixAt(k++, _m.matrix); }
  showRoot.add(pins);
  for (let i = 0; i < 18; i++) { const cap = new T.Mesh(new T.BoxGeometry(0.22, 0.14, 0.12), metal('#c9a54a')); cap.position.set(rand(-2.7, 2.7), 0.22, Math.random() < .5 ? rand(2.5, 2.8) : rand(-2.8, -2.5)); showRoot.add(cap); }

function updateShow(dt) {
